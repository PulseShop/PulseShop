<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google rasterises the favicon it shows beside a search result to a
         multiple of 48, so it is offered one at exactly that size first and the
         192 as the larger fallback for browser tabs and bookmarks. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />

    <!-- App type system: Inter on phones, Roboto on desktop.

         Both faces are requested in ONE stylesheet so the switch at 1024px
         (see styles/tokens.css) never waits on a second network round trip —
         a viewport-scoped @import would fetch Roboto only once a desktop
         browser matched it, which is exactly when it is already needed. The
         preconnects are what make that single request cheap.

         Variable axes are requested as ranges rather than fixed weights so the
         whole 100..900 scale is available to the type ramp without shipping a
         file per weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme, before first paint.

         React sets this too (stores/theme.ts), but it cannot run until the
         bundle has parsed, and until then the page paints with the light
         palette. On a phone opening an installed dark-mode app that is a white
         flash on every single launch. This reads the same persisted key the
         store writes and stamps the attribute while the parser is still in
         <head>, so the first paint is already correct.

         Deliberately inline, tiny and failure-tolerant: if localStorage is
         unavailable or the value is malformed, it falls through to the OS
         preference, which is the default mode anyway. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("pulseshop-theme");
          var mode = raw ? JSON.parse(raw).state.mode : "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var t = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#141312");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="PulseShop — social-commerce storefront. Browse, favorite, and order in one tap." />

    <!-- iOS ignores the web manifest entirely: without these, "Add to Home
         Screen" saves a bookmark that opens in a Safari tab with the address
         bar, using a screenshot of the page as its icon. These are what make it
         launch full-screen with the real logo, and they have no Android effect. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PulseShop" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>PulseShop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "edee5a32c3eb4dc49c7061570b0d67cc"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
